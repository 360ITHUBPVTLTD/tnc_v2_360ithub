name: Deploy to tncv2 bench

on:
  push:
    branches: [360ithub_master]
    paths-ignore:
      - '**.md'
      - 'license.txt'
      - 'v1_schema_export/**'
  workflow_dispatch:

# Keyed to the BENCH, not the app. tnc_v2_360ithub and clarity_360ithub are both
# installed on tncv2.360ithub.com, and per-app groups let them run `bench migrate`
# and restart the same containers simultaneously. Sharing one group makes GitHub
# queue the second behind the first. If this app is ever deployed to a second
# bench, split this into a matrix and move concurrency to the job level.
# Never cancel a run mid-migrate: a half-applied schema change is worse than a wait.
concurrency:
  group: deploy-bench-tncv2.360ithub.com
  cancel-in-progress: false

jobs:
  check:
    name: Syntax and undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches PYENV_VERSION 3.12.14 on the bench

      - name: Compile every module
        run: python -m compileall -q tnc_v2_360ithub

      # Deliberately NOT the full pyproject ruff config: the repo currently has
      # ~375 style findings, and gating deploys on those would mean a permanently
      # red pipeline. These rules are the ones that mean "this will actually break
      # at runtime" - syntax errors and undefined names - and they pass today.
      # Widen the select list as the backlog gets cleaned up.
      - name: Ruff (breakage-only rules)
        run: |
          pip install --quiet ruff==0.8.1
          ruff check --select=E9,F821,F632,F702 --no-cache .

  deploy:
    name: Deploy to tncv2.360ithub.com
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Pull, migrate and restart on the bench
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: >-
            /usr/local/bin/deploy-bench-app.sh
            tnc_v2_360ithub 360ithub_master
            test-demo-erpnext-w6y5gf tncv2.360ithub.com
